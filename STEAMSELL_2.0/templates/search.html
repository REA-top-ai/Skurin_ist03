<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SteamSell - ИИ Поиск</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* ОСНОВНЫЕ СТИЛИ - ОБЩИЕ ДЛЯ ВСЕХ СТРАНИЦ */
        :root {
            --bg-color: #050509;
            --panel-bg: rgba(23, 26, 33, 0.8);
            --accent-cyan: #00f2fe;
            --accent-cyan-dim: rgba(0, 242, 254, 0.5);
            --accent-green: #beee11;
            --text-color: #ffffff;
            --text-dim: #8492a6;
            --border-color: #1a2a3a;
            --font-main: 'Oxanium', sans-serif;
            --glitch-border: 2px solid var(--accent-cyan);
        }

        body {
            background-color: var(--bg-color);
            background-image:
                linear-gradient(rgba(0, 242, 254, 0.03) 1px, transparent 1px),
                linear-gradient(90px, rgba(0, 242, 254, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            color: var(--text-color);
            font-family: var(--font-main);
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }

        /* КНОПКИ */
        .btn-base, button, .btn-back {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 0; /* Рубленый стиль */
            border: 1px solid var(--accent-cyan);
            background: transparent;
            color: var(--accent-cyan);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            font-family: var(--font-main);
            position: relative;
            overflow: hidden;
        }

        .btn-base:hover, button:hover {
            background: var(--accent-cyan);
            color: var(--bg-color);
            box-shadow: 0 0 15px var(--accent-cyan-dim);
        }

        .btn-base:active, button:active {
            transform: translateY(1px);
        }

        /* Кнопка "Назад" (специфично) */
        .btn-back {
            background: rgba(61, 68, 80, 0.3);
            border-color: var(--text-dim);
            color: var(--text-dim);
        }
        .btn-back:hover {
            border-color: var(--text-color);
            background: rgba(61, 68, 80, 0.5);
            color: var(--text-color);
            box-shadow: none;
        }

        /* ЗАГОЛОВКИ */
        h1, h2, h3, h4 {
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 0;
        }

        /* ПОЛЯ ВВОДА */
        input[type="text"] {
            width: 100%;
            max-width: 600px;
            padding: 15px;
            border-radius: 0;
            border: none;
            border-bottom: 2px solid var(--border-color);
            background: rgba(42, 71, 94, 0.2);
            color: var(--text-color);
            font-size: 18px;
            font-family: var(--font-main);
            outline: none;
            transition: all 0.3s;
            box-sizing: border-box;
        }

        input[type="text"]:focus {
            border-bottom-color: var(--accent-cyan);
            background: rgba(42, 71, 94, 0.4);
            box-shadow: 0 5px 15px -5px var(--accent-cyan-dim);
        }


        /* СПЕЦИФИКА СТРАНИЦЫ ПОИСКА */
        .search-container {
            max-width: 1000px;
            margin: 0 auto;
            text-align: center;
            padding-top: 40px;
        }

        .search-container h1 {
            font-size: 3em;
            background: linear-gradient(180deg, #fff 0%, var(--accent-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .search-container p {
            color: var(--text-dim);
            margin-bottom: 40px;
        }

        .nav-header {
            display: flex;
            justify-content: flex-start;
            margin-bottom: 20px;
        }

        /* ХАК ДЛЯ ЦЕНТРИРОВАНИЯ ИНПУТА И КНОПКИ */
        .search-form-group {
            margin-bottom: 40px;
        }
        .search-form-group button {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 1.1em;
        }

        /* ГРИД РЕЗУЛЬТАТОВ */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 50px;
            text-align: left;
        }

        /* КАРТОЧКА ИГРЫ */
        .card {
            background: var(--panel-bg);
            border-radius: 0;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* Эффект при наведении на карточку */
        .card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-cyan);
            box-shadow: 0 10px 20px -10px var(--accent-cyan-dim);
        }

        /* Псевдо-элемент для "уголка" */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 20px 20px 0;
            border-color: transparent var(--border-color) transparent transparent;
            transition: border-color 0.3s;
        }
        .card:hover::before {
            border-color: transparent var(--accent-cyan) transparent transparent;
        }

        .card img {
            width: 100%;
            height: auto;
            display: block;
            border-bottom: 1px solid var(--border-color);
        }

        .card-info {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-info h4 {
            margin: 0 0 15px 0;
            font-size: 1.1em;
            line-height: 1.3;
            color: var(--text-color);
            text-transform: none; /* Названия игр не капсим */
            letter-spacing: normal;
        }

        .steam-link-text {
            color: var(--accent-cyan);
            font-size: 0.9em;
            margin: 0;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ЛЕЙБЛ СОВПАДЕНИЯ */
        .match-badge {
            background: rgba(190, 238, 17, 0.1);
            color: var(--accent-green);
            padding: 6px 12px;
            font-size: 12px;
            font-weight: bold;
            border-bottom: 1px solid rgba(190, 238, 17, 0.3);
            letter-spacing: 1px;
        }

        #loading {
            display: none;
            margin-top: 30px;
            color: var(--accent-cyan);
            font-style: italic;
            font-size: 1.1em;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>
    <div class="nav-header">
        <a href="/dashboard" class="btn-back">← НАЗАД</a>
    </div>

    <div class="search-container">
        <h1>ИИ Поиск Игр</h1>
        <p>Опишите, во что хотите поиграть (например: "мрачный шутер про космос")</p>

        <div class="search-form-group">
            <input type="text" id="promptInput" placeholder="Введите ваш запрос...">
            <br>
            <button onclick="runAISearch()">НАЙТИ ИГРУ</button>
        </div>

        <div id="loading">Нейросеть анализирует игры Steam... Это может занять до 15 секунд...</div>
        <div class="grid" id="results"></div>
    </div>

    <script>
        async function runAISearch() {
            const prompt = document.getElementById('promptInput').value;
            const resultsDiv = document.getElementById('results');
            const loading = document.getElementById('loading');

            if (!prompt) return alert("Введите запрос!");

            resultsDiv.innerHTML = '';
            loading.style.display = 'block';

            try {
                const response = await fetch(`/ai-prompt-search?prompt=${encodeURIComponent(prompt)}`, {
                    method: 'POST'
                });

                const data = await response.json();
                loading.style.display = 'none';

                if (!data.results || data.results.length === 0) {
                    resultsDiv.innerHTML = '<p style="text-align:center; color:var(--text-dim); grid-column: 1/-1;">Ничего не найдено. Попробуйте уточнить запрос.</p>';
                    return;
                }

                resultsDiv.innerHTML = data.results.map(game => `
                    <a href="https://store.steampowered.com/app/${game.steamAppID}" target="_blank" style="text-decoration: none; color: inherit;">
                        <div class="card">
                            <div class="match-badge">
                                СОВПАДЕНИЕ: ${(game.ai_score * 100).toFixed(0)}%
                            </div>
                            <img src="https://cdn.akamai.steamstatic.com/steam/apps/${game.steamAppID}/header.jpg" onerror="this.src='https://via.placeholder.com/460x215?text=No+Image'">
                            <div class="card-info">
                                <h4>${game.title}</h4>
                                <p class="steam-link-text">В магазин Steam →</p>
                            </div>
                        </div>
                    </a>
                `).join('');

            } catch (err) {
                loading.style.display = 'none';
                alert("Ошибка сервера. Убедитесь, что main.py запущен и модель ИИ загружена.");
                console.error(err);
            }
        }

        // Поиск по нажатию Enter
        document.getElementById('promptInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                runAISearch();
            }
        });
    </script>
</body>
</html>
